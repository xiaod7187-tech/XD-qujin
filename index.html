<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片解析为像素块</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #111;
      color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: #1c1c1c;
      padding: 16px 24px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #333;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label {
      font-size: 0.9rem;
      color: #bbb;
    }
    input[type="range"] {
      width: 140px;
      accent-color: #6c5ce7;
    }
    .value {
      min-width: 36px;
      text-align: center;
      font-weight: 600;
      color: #a29bfe;
    }
    button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #5a4bd1;
    }
    button:active {
      transform: scale(0.97);
    }
    .canvas-wrapper {
      background: #0a0a0a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 100%;
      overflow: auto;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
    }
    .info {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #666;
    }
    .error {
      color: #ff6b6b;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>图片 → 像素块</h1>
  <p class="subtitle">解析 1.jpg 的像素颜色，用清晰方块重新表达</p>

  <div class="controls">
    <div class="control-group">
      <label>像素精度</label>
      <input type="range" id="resolution" min="24" max="200" value="80" step="8">
      <span class="value" id="resValue">80</span>
    </div>

    <div class="control-group">
      <label>放大倍数</label>
      <input type="range" id="scale" min="2" max="12" value="5" step="1">
      <span class="value" id="scaleValue">5</span>
    </div>

    <button onclick="processImage()">重新生成</button>
    <button onclick="downloadImage()" style="background:#00b894;">下载图片</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="output"></canvas>
  </div>

  <p class="info">提示：精度越低，像素块越大、越抽象；精度越高，越接近原图。</p>
  <p class="error" id="errorMsg">无法加载 1.jpg，请确认文件与本 HTML 在同一目录下。</p>

  <script>
    const canvas = document.getElementById('output');
    const ctx = canvas.getContext('2d');
    const resSlider = document.getElementById('resolution');
    const scaleSlider = document.getElementById('scale');
    const resValue = document.getElementById('resValue');
    const scaleValue = document.getElementById('scaleValue');
    const errorMsg = document.getElementById('errorMsg');

    let originalImage = null;

    // 实时更新显示数值
    resSlider.oninput = () => resValue.textContent = resSlider.value;
    scaleSlider.oninput = () => scaleValue.textContent = scaleSlider.value;

    // 页面加载后自动读取 1.jpg
    window.onload = () => {
      const img = new Image();
      img.crossOrigin = "Anonymous"; // 防止跨域问题
      img.onload = () => {
        originalImage = img;
        errorMsg.style.display = 'none';
        processImage();
      };
      img.onerror = () => {
        errorMsg.style.display = 'block';
      };
      img.src = '1.png'; // 这里读取同目录下的 1.jpg
    };

    function processImage() {
      if (!originalImage) return;

      const targetWidth = parseInt(resSlider.value);
      const scale = parseInt(scaleSlider.value);
      const aspect = originalImage.height / originalImage.width;
      const w = targetWidth;
      const h = Math.round(targetWidth * aspect);

      // 临时画布：把原图缩放到目标像素精度（关闭平滑）
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.imageSmoothingEnabled = false;
      tempCtx.drawImage(originalImage, 0, 0, w, h);

      // 读取每个像素的颜色
      const imageData = tempCtx.getImageData(0, 0, w, h);
      const data = imageData.data;

      // 设置输出画布尺寸
      canvas.width = w * scale;
      canvas.height = h * scale;
      ctx.imageSmoothingEnabled = false;

      // 清空画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 用方块精确绘制每一个像素
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3] / 255;

          if (a < 0.01) continue; // 跳过全透明像素

          ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
          ctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }

    // 下载当前像素画
    function downloadImage() {
      if (!originalImage) return;
      const link = document.createElement('a');
      link.download = 'pixel-art.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
