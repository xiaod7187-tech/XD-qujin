<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素图工具 - 单图像素化 + 像素微动</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 60px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 6px; font-weight: 600; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 22px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: #1c1c1c;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #333;
      width: 100%;
    }
    .control-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.88rem; color: #bbb; white-space: nowrap; }
    input[type="range"] { width: 120px; accent-color: #6c5ce7; }
    .value { min-width: 32px; text-align: center; font-weight: 600; color: #a29bfe; font-size: 0.9rem; }
    input[type="file"] { display: none; }
    .file-btn { background: #2d3436; color: #ddd; border: 1px solid #444; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; transition: background 0.2s; }
    .file-btn:hover { background: #3d4446; }
    .file-name { font-size: 0.8rem; color: #888; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button.action { background: #6c5ce7; color: white; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
    button.action:hover { background: #5a4bd1; }
    button.action:active { transform: scale(0.97); }
    button.action.green { background: #00b894; }
    button.action.green:hover { background: #00a884; }
    button.action.orange { background: #e17055; }
    button.action.orange:hover { background: #d16045; }

    .canvas-wrapper {
      background: #0a0a0a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 100%;
      overflow: auto;
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }

    .info { margin-top: 16px; font-size: 0.85rem; color: #666; text-align: center; line-height: 1.5; }
    .status { margin-top: 12px; font-size: 0.9rem; color: #a29bfe; min-height: 1.4em; }

    .motion-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: #1c1c1c;
      padding: 16px 20px;
      border-radius: 12px;
      margin-top: 16px;
      border: 1px solid #333;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>像素图工具</h1>
  <p class="subtitle">单图像素化 + 像素微动循环（纯前端）</p>

  <div class="controls">
    <div class="control-group">
      <label class="file-btn" for="singleFile">选择图片</label>
      <input type="file" id="singleFile" accept="image/*">
      <span class="file-name" id="singleFileName">未选择</span>
    </div>

    <div class="control-group">
      <label>像素精度</label>
      <input type="range" id="singleRes" min="24" max="200" value="80" step="8">
      <span class="value" id="singleResVal">80</span>
    </div>

    <div class="control-group">
      <label>放大倍数</label>
      <input type="range" id="singleScale" min="2" max="12" value="5" step="1">
      <span class="value" id="singleScaleVal">5</span>
    </div>

    <button class="action" onclick="processSingle()">重新生成</button>
    <button class="action green" onclick="downloadSingle()">下载图片</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="singleCanvas"></canvas>
  </div>

  <!-- 微动控制 -->
  <div class="motion-controls">
    <div class="control-group">
      <label>微动强度</label>
      <input type="range" id="singleMotion" min="0" max="100" value="30" step="5">
      <span class="value" id="singleMotionVal">30</span>
    </div>
    <button class="action orange" onclick="toggleSingleMotion()">开始/停止微动</button>
    <button class="action" onclick="downloadSingleMotion()">下载带微动图片</button>
  </div>

  <p class="info">提示：拖动微动强度滑块 + 点击“开始/停止微动”即可让女孩轻轻摇摆、颤动</p>

  <script>
    let singleImg = null;
    const singleCanvas = document.getElementById('singleCanvas');
    const singleCtx = singleCanvas.getContext('2d');

    document.getElementById('singleFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('singleFileName').textContent = file.name;
      try {
        singleImg = await loadImageFromFile(file);
        processSingle();
      } catch (err) {
        alert('图片加载失败');
      }
    });

    document.getElementById('singleRes').oninput = (e) => {
      document.getElementById('singleResVal').textContent = e.target.value;
    };
    document.getElementById('singleScale').oninput = (e) => {
      document.getElementById('singleScaleVal').textContent = e.target.value;
    };

    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('无文件'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片加载失败'));
        };
        img.src = url;
      });
    }

    function getPixelData(img, w, h) {
      const temp = document.createElement('canvas');
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext('2d');
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(img, 0, 0, w, h);
      return tctx.getImageData(0, 0, w, h);
    }

    function drawPixelBlocks(ctx, imageData, scale) {
      const w = imageData.width;
      const h = imageData.height;
      const data = imageData.data;
      ctx.clearRect(0, 0, w * scale, h * scale);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const a = data[i + 3] / 255;
          if (a < 0.01) continue;
          ctx.fillStyle = `rgba(\( {data[i]}, \){data[i+1]},\( {data[i+2]}, \){a})`;
          ctx.fillRect(x * scale, y * scale, scale, scale);
        }
      }
    }

    function processSingle() {
      if (!singleImg) return;
      const targetW = parseInt(document.getElementById('singleRes').value);
      const scale = parseInt(document.getElementById('singleScale').value);
      const aspect = singleImg.height / singleImg.width;
      const w = targetW;
      const h = Math.max(1, Math.round(targetW * aspect));

      const imageData = getPixelData(singleImg, w, h);
      singleCanvas.width = w * scale;
      singleCanvas.height = h * scale;
      singleCtx.imageSmoothingEnabled = false;
      drawPixelBlocks(singleCtx, imageData, scale);
    }

    // ==================== 像素微动循环 ====================
    let singleMotionTimer = null;
    let singleMotionActive = false;
    let singleMotionFrame = 0;
    let originalSingleData = null;

    function toggleSingleMotion() {
      singleMotionActive = !singleMotionActive;
      const motionVal = parseInt(document.getElementById('singleMotion').value);
      
      if (singleMotionActive) {
        document.getElementById('singleMotionVal').textContent = motionVal;
        originalSingleData = getPixelData(singleImg, 80, 80); // 默认大小
        singleMotionFrame = 0;
        singleMotionTimer = setInterval(() => {
          if (singleMotionActive && singleImg) {
            animateSinglePixel(motionVal);
          }
        }, 16);
      } else {
        clearInterval(singleMotionTimer);
        singleMotionTimer = null;
        if (singleImg) {
          processSingle();
        }
      }
    }

    function animateSinglePixel(motion) {
      const w = 80;
      const h = 80;
      const scale = parseInt(document.getElementById('singleScale').value);
      const mid = singleCtx.createImageData(w * scale, h * scale);

      const s = originalSingleData.data;
      const d = mid.data;

      const shake = Math.floor(motion / 3) * Math.sin(singleMotionFrame * 0.3);
      const bob = Math.floor(motion / 4) * Math.sin(singleMotionFrame * 0.15 + 2);
      const skirtSwing = Math.floor(motion / 5) * Math.sin(singleMotionFrame * 0.4);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const idx = (y * scale * (w * scale) + x * scale) * 4;

          const headOffsetX = shake * Math.sin((x + y * 3) * 0.12);
          const bodyOffsetY = bob * Math.sin((x * 2 + y) * 0.08);
          const skirtOffsetY = skirtSwing * Math.sin(x * 0.15 + y * 0.25);

          const finalX = Math.max(0, Math.min(w - 1, x + Math.floor(headOffsetX)));
          const finalY = Math.max(0, Math.min(h - 1, y + Math.floor(bodyOffsetY) + Math.floor(skirtOffsetY)));

          const finalIdx = (finalY * w + finalX) * 4;

          d[idx]     = s[finalIdx];
          d[idx + 1] = s[finalIdx + 1];
          d[idx + 2] = s[finalIdx + 2];
          d[idx + 3] = s[finalIdx + 3];
        }
      }

      drawPixelBlocks(singleCtx, mid, scale);
      singleMotionFrame++;
    }

    function downloadSingle() {
      if (!singleImg) return;
      const link = document.createElement('a');
      link.download = 'pixel-art.png';
      link.href = singleCanvas.toDataURL('image/png');
      link.click();
    }

    function downloadSingleMotion() {
      if (!singleImg) return;
      const link = document.createElement('a');
      link.download = 'pixel-motion.png';
      link.href = singleCanvas.toDataURL('image/png');
      link.click();
    }

    // 通用函数
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('无文件'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片加载失败'));
        };
        img.src = url;
      });
    }
  </script>
</body>
</html>
