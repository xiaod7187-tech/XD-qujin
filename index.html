<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素图工具 · 单图像素化 & 人体部位微动</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 60px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 6px; font-weight: 600; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 22px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
    .tab-btn {
      background: #1c1c1c; color: #aaa; border: 1px solid #333;
      padding: 10px 22px; border-radius: 10px; cursor: pointer;
      font-size: 0.95rem; transition: all 0.2s;
    }
    .tab-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }
    .tab-btn:hover:not(.active) { background: #2a2a2a; color: #ddd; }

    .panel { display: none; width: 100%; max-width: 920px; flex-direction: column; align-items: center; }
    .panel.active { display: flex; }

    .controls {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
      background: #1c1c1c; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px;
      border: 1px solid #333; width: 100%;
    }
    .control-group { display: flex; align-items: center; gap: 8px; }
    label { font-size: 0.88rem; color: #bbb; white-space: nowrap; }
    input[type="range"] { width: 120px; accent-color: #6c5ce7; }
    .value { min-width: 32px; text-align: center; font-weight: 600; color: #a29bfe; font-size: 0.9rem; }
    input[type="file"] { display: none; }
    .file-btn {
      background: #2d3436; color: #ddd; border: 1px solid #444;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.88rem;
    }
    .file-btn:hover { background: #3d4446; }
    .file-name { font-size: 0.8rem; color: #888; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select {
      background: #2d3436; color: #ddd; border: 1px solid #444;
      padding: 7px 12px; border-radius: 8px; font-size: 0.88rem; cursor: pointer;
    }
    button.action {
      background: #6c5ce7; color: white; border: none; padding: 8px 18px;
      border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    }
    button.action:hover { background: #5a4bd1; }
    button.action.green { background: #00b894; }
    button.action.green:hover { background: #00a884; }
    button.action.orange { background: #e17055; }
    button.action.orange:hover { background: #d16045; }
    button.action:disabled { opacity: 0.45; cursor: not-allowed; }

    .canvas-wrapper {
      background: #0a0a0a; padding: 12px; border-radius: 12px;
      border: 1px solid #333; max-width: 100%; overflow: auto;
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100%; }
    .info { margin-top: 16px; font-size: 0.85rem; color: #666; text-align: center; line-height: 1.5; }
    .status { margin-top: 12px; font-size: 0.9rem; color: #a29bfe; min-height: 1.4em; }

    .part-preview {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px;
    }
    .part-preview canvas { border: 1px solid #333; border-radius: 6px; background: #0a0a0a; }
    .part-preview p { font-size: 0.75rem; color: #888; margin-bottom: 4px; text-align: center; }
  </style>
</head>
<body>
  <h1>像素图工具</h1>
  <p class="subtitle">单图像素化 · 人体部位识别后自然微动（BodyPix）</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="single">单图 → 像素块</button>
    <button class="tab-btn" data-tab="micro">人体部位微动</button>
  </div>

  <!-- ========== 单图像素化 ========== -->
  <div class="panel active" id="panel-single">
    <div class="controls">
      <div class="control-group">
        <label class="file-btn" for="singleFile">选择图片</label>
        <input type="file" id="singleFile" accept="image/*">
        <span class="file-name" id="singleFileName">未选择</span>
      </div>
      <div class="control-group">
        <label>像素精度</label>
        <input type="range" id="singleRes" min="24" max="200" value="80" step="8">
        <span class="value" id="singleResVal">80</span>
      </div>
      <div class="control-group">
        <label>放大倍数</label>
        <input type="range" id="singleScale" min="2" max="12" value="5" step="1">
        <span class="value" id="singleScaleVal">5</span>
      </div>
      <button class="action" onclick="processSingle()">重新生成</button>
      <button class="action green" onclick="downloadSingle()">下载图片</button>
    </div>
    <div class="canvas-wrapper"><canvas id="singleCanvas"></canvas></div>
    <p class="info">提示：精度越低，像素块越大、越抽象；精度越高，越接近原图。</p>
  </div>

  <!-- ========== 人体部位微动 ========== -->
  <div class="panel" id="panel-micro">
    <div class="controls">
      <div class="control-group">
        <label class="file-btn" for="microFile">选择图片</label>
        <input type="file" id="microFile" accept="image/*">
        <span class="file-name" id="microFileName">未选择</span>
      </div>
      <div class="control-group">
        <label>像素精度</label>
        <input type="range" id="microRes" min="32" max="128" value="64" step="8">
        <span class="value" id="microResVal">64</span>
      </div>
      <div class="control-group">
        <label>放大倍数</label>
        <input type="range" id="microScale" min="3" max="10" value="5" step="1">
        <span class="value" id="microScaleVal">5</span>
      </div>
      <div class="control-group">
        <label>动作强度</label>
        <input type="range" id="microIntensity" min="0.5" max="3.5" value="1.3" step="0.1">
        <span class="value" id="microIntensityVal">1.3</span>
      </div>
      <div class="control-group">
        <label>速度</label>
        <input type="range" id="microSpeed" min="0.4" max="2" value="0.85" step="0.05">
        <span class="value" id="microSpeedVal">0.85</span>
      </div>
    </div>

    <div class="controls" style="margin-top:-6px;">
      <div class="control-group">
        <label>微动模式</label>
        <select id="microMode">
          <option value="alive">综合生动（推荐）</option>
          <option value="breathe">自然呼吸</option>
          <option value="sway">身体轻晃</option>
          <option value="legs">腿部重点</option>
        </select>
      </div>
      <div class="control-group">
        <label>时长(秒)</label>
        <input type="range" id="microDuration" min="3" max="10" value="5" step="0.5">
        <span class="value" id="microDurationVal">5</span>
      </div>
      <div class="control-group">
        <label>帧率</label>
        <input type="range" id="microFps" min="12" max="30" value="20" step="1">
        <span class="value" id="microFpsVal">20</span>
      </div>
      <button class="action" id="btnMicroPlay" onclick="playMicro()" disabled>播放预览</button>
      <button class="action orange" id="btnMicroRecord" onclick="recordMicro()" disabled>录制并下载视频</button>
      <button class="action" id="btnMicroStop" onclick="stopMicro()" disabled style="background:#636e72;">停止</button>
    </div>

    <div class="part-preview" id="partPreview" style="display:none;">
      <div>
        <p>部位分割预览（彩色=人物部位）</p>
        <canvas id="partCanvas" width="160" height="160"></canvas>
      </div>
    </div>

    <div class="canvas-wrapper"><canvas id="microCanvas"></canvas></div>
    <p class="status" id="microStatus">请先上传图片（首次会加载人体识别模型，约需几秒）</p>
    <p class="info">
      流程：上传 → BodyPix 识别人体部位 → 像素化 → 按部位施加不同动作。<br>
      <b>躯干</b>负责呼吸起伏，<b>腿部</b>有独立轻微晃动，背景与沙发保持静止。<br>
      建议强度 1.0～1.6，速度 0.7～1.0。需要联网加载模型（CDN）。
    </p>
  </div>

  <script>
    // ==================== 通用工具 ====================
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('无文件'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
        img.src = url;
      });
    }

    function getPixelData(img, w, h) {
      const temp = document.createElement('canvas');
      temp.width = w; temp.height = h;
      const tctx = temp.getContext('2d');
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(img, 0, 0, w, h);
      return tctx.getImageData(0, 0, w, h);
    }

    function drawPixelBlocks(ctx, imageData, scale, offsets = null) {
      const w = imageData.width, h = imageData.height, data = imageData.data;
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const a = data[i + 3] / 255;
          if (a < 0.01) continue;

          let ox = 0, oy = 0, s = scale;
          if (offsets) {
            const o = offsets[y * w + x];
            if (o) { ox = o.x || 0; oy = o.y || 0; if (o.s !== undefined) s = o.s; }
          }

          ctx.fillStyle = `rgba(${data[i]},${data[i+1]},${data[i+2]},${a})`;
          ctx.fillRect(
            Math.floor(x * scale + ox),
            Math.floor(y * scale + oy),
            Math.max(1, Math.round(s)),
            Math.max(1, Math.round(s))
          );
        }
      }
    }

    // BodyPix 部位 ID 映射
    function classifyPart(partId) {
      if (partId < 0) return 'bg';
      if (partId <= 1) return 'head';
      if (partId >= 2 && partId <= 5) return 'arm';
      if (partId >= 6 && partId <= 11) return 'torso';
      if (partId >= 12 && partId <= 15) return 'leg';
      return 'torso';
    }

    // ==================== 标签切换 ====================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab !== 'micro') stopMicro();
      });
    });

    // ==================== 单图像素化 ====================
    let singleImg = null;
    const singleCanvas = document.getElementById('singleCanvas');
    const singleCtx = singleCanvas.getContext('2d');

    document.getElementById('singleFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('singleFileName').textContent = file.name;
      try {
        singleImg = await loadImageFromFile(file);
        processSingle();
      } catch (err) { alert('图片加载失败'); }
    });
    document.getElementById('singleRes').oninput = e => document.getElementById('singleResVal').textContent = e.target.value;
    document.getElementById('singleScale').oninput = e => document.getElementById('singleScaleVal').textContent = e.target.value;

    function processSingle() {
      if (!singleImg) return;
      const targetW = parseInt(document.getElementById('singleRes').value);
      const scale = parseInt(document.getElementById('singleScale').value);
      const aspect = singleImg.height / singleImg.width;
      const w = targetW, h = Math.max(1, Math.round(targetW * aspect));
      const imageData = getPixelData(singleImg, w, h);
      singleCanvas.width = w * scale; singleCanvas.height = h * scale;
      singleCtx.imageSmoothingEnabled = false;
      drawPixelBlocks(singleCtx, imageData, scale);
    }

    function downloadSingle() {
      if (!singleImg) return;
      const link = document.createElement('a');
      link.download = 'pixel-art.png';
      link.href = singleCanvas.toDataURL('image/png');
      link.click();
    }

    // ==================== 人体部位微动 ====================
    let microImg = null;
    let microData = null;
    let microPartMap = null;
    let microW = 0, microH = 0;
    let microAnimId = null;
    let isMicroPlaying = false;
    let isMicroRecording = false;
    let microMediaRecorder = null;
    let microRecordedChunks = [];
    let microStartTime = 0;
    let bodyPixNet = null;
    let modelLoading = false;

    const microCanvas = document.getElementById('microCanvas');
    const microCtx = microCanvas.getContext('2d');
    const partCanvas = document.getElementById('partCanvas');
    const partCtx = partCanvas.getContext('2d');

    document.getElementById('microRes').oninput = e => {
      document.getElementById('microResVal').textContent = e.target.value;
      if (microImg) prepareMicroData();
    };
    document.getElementById('microScale').oninput = e => {
      document.getElementById('microScaleVal').textContent = e.target.value;
      if (microImg) prepareMicroData();
    };
    document.getElementById('microIntensity').oninput = e => document.getElementById('microIntensityVal').textContent = e.target.value;
    document.getElementById('microSpeed').oninput = e => document.getElementById('microSpeedVal').textContent = parseFloat(e.target.value).toFixed(2);
    document.getElementById('microDuration').oninput = e => document.getElementById('microDurationVal').textContent = e.target.value;
    document.getElementById('microFps').oninput = e => document.getElementById('microFpsVal').textContent = e.target.value;
    document.getElementById('microMode').onchange = () => { if (microData) drawMicroFrame(0); };

    document.getElementById('microFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('microFileName').textContent = file.name;
      try {
        microImg = await loadImageFromFile(file);
        await prepareMicroData();
      } catch (err) {
        console.error(err);
        alert('图片处理失败: ' + err.message);
      }
    });

    async function ensureBodyPix() {
      if (bodyPixNet) return bodyPixNet;
      if (modelLoading) {
        while (modelLoading) await new Promise(r => setTimeout(r, 100));
        return bodyPixNet;
      }
      modelLoading = true;
      document.getElementById('microStatus').textContent = '正在加载人体识别模型（首次约需 5～15 秒）…';
      try {
        bodyPixNet = await bodyPix.load({
          architecture: 'MobileNetV1',
          outputStride: 16,
          multiplier: 0.75,
          quantBytes: 2
        });
        document.getElementById('microStatus').textContent = '模型加载完成，正在识别人体部位…';
        return bodyPixNet;
      } catch (err) {
        modelLoading = false;
        throw new Error('模型加载失败，请检查网络后重试');
      } finally {
        modelLoading = false;
      }
    }

    async function prepareMicroData() {
      if (!microImg) {
        updateMicroButtons(false);
        document.getElementById('microStatus').textContent = '请先上传图片';
        return;
      }

      updateMicroButtons(false);
      const targetW = parseInt(document.getElementById('microRes').value);
      const scale = parseInt(document.getElementById('microScale').value);
      const intensity = parseFloat(document.getElementById('microIntensity').value);

      const aspect = microImg.height / microImg.width;
      microW = targetW;
      microH = Math.max(1, Math.round(targetW * aspect));

      microData = getPixelData(microImg, microW, microH);

      try {
        const net = await ensureBodyPix();
        document.getElementById('microStatus').textContent = '正在识别人体部位…';

        const segW = Math.min(320, microImg.width);
        const segH = Math.round(segW * (microImg.height / microImg.width));
        const segCanvas = document.createElement('canvas');
        segCanvas.width = segW; segCanvas.height = segH;
        const segCtx = segCanvas.getContext('2d');
        segCtx.drawImage(microImg, 0, 0, segW, segH);

        const segmentation = await net.segmentPersonParts(segCanvas, {
          flipHorizontal: false,
          internalResolution: 'medium',
          segmentationThreshold: 0.6
        });

        microPartMap = new Array(microW * microH).fill('bg');
        const partData = segmentation.data;

        for (let y = 0; y < microH; y++) {
          for (let x = 0; x < microW; x++) {
            const sx = Math.floor(x / microW * segW);
            const sy = Math.floor(y / microH * segH);
            const partId = partData[sy * segW + sx];
            microPartMap[y * microW + x] = classifyPart(partId);
          }
        }

        drawPartPreview(segmentation, segW, segH);
        document.getElementById('partPreview').style.display = 'flex';

      } catch (err) {
        console.error(err);
        document.getElementById('microStatus').textContent = '部位识别失败，将使用垂直分区兜底: ' + err.message;
        microPartMap = new Array(microW * microH);
        for (let y = 0; y < microH; y++) {
          const ny = y / (microH - 1);
          let p = 'torso';
          if (ny < 0.18) p = 'head';
          else if (ny > 0.55) p = 'leg';
          for (let x = 0; x < microW; x++) microPartMap[y * microW + x] = p;
        }
        document.getElementById('partPreview').style.display = 'none';
      }

      const pad = Math.ceil(intensity * 3) + 8;
      microCanvas.width = microW * scale + pad * 2;
      microCanvas.height = microH * scale + pad * 2;
      microCtx.imageSmoothingEnabled = false;

      drawMicroFrame(0);
      updateMicroButtons(true);
      document.getElementById('microStatus').textContent = `已就绪：${microW}×${microH} · 部位已标记 · 可播放或录制`;
    }

    function drawPartPreview(segmentation, segW, segH) {
      const colors = {
        '-1': [30, 30, 30],
        0: [255, 200, 180], 1: [255, 200, 180],
        2: [100, 180, 255], 3: [100, 180, 255], 4: [100, 180, 255], 5: [100, 180, 255],
        6: [120, 220, 120], 7: [120, 220, 120], 8: [120, 220, 120], 9: [120, 220, 120],
        10: [120, 220, 120], 11: [120, 220, 120],
        12: [255, 160, 80], 13: [255, 160, 80], 14: [255, 160, 80], 15: [255, 160, 80]
      };
      const maxSide = 160;
      const sc = Math.min(maxSide / segW, maxSide / segH);
      partCanvas.width = Math.round(segW * sc);
      partCanvas.height = Math.round(segH * sc);
      const imgData = partCtx.createImageData(partCanvas.width, partCanvas.height);
      const d = imgData.data;
      for (let y = 0; y < partCanvas.height; y++) {
        for (let x = 0; x < partCanvas.width; x++) {
          const sx = Math.floor(x / sc);
          const sy = Math.floor(y / sc);
          const pid = segmentation.data[sy * segW + sx];
          const c = colors[pid] || colors['-1'];
          const i = (y * partCanvas.width + x) * 4;
          d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2]; d[i+3] = 255;
        }
      }
      partCtx.putImageData(imgData, 0, 0);
    }

    function computeOffsets(t) {
      const mode = document.getElementById('microMode').value;
      const intensity = parseFloat(document.getElementById('microIntensity').value);
      const speed = parseFloat(document.getElementById('microSpeed').value);
      const w = microW, h = microH;
      const offsets = new Array(w * h);

      const breath = Math.sin(t * speed * 1.2);
      const bodySway = Math.sin(t * speed * 0.7 + 0.3);
      const legSway = Math.sin(t * speed * 1.4 + 1.6);
      const legSway2 = Math.sin(t * speed * 1.1 + 0.8);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const part = microPartMap ? microPartMap[idx] : 'torso';
          let ox = 0, oy = 0;

          if (part === 'bg') {
            offsets[idx] = { x: 0, y: 0 };
            continue;
          }

          if (mode === 'breathe' || mode === 'alive') {
            if (part === 'torso' || part === 'arm') {
              oy += breath * intensity * 0.7;
              ox += bodySway * intensity * 0.25;
            } else if (part === 'head') {
              oy += breath * intensity * 0.35;
              ox += bodySway * intensity * 0.15;
            }
          }

          if (mode === 'sway' || mode === 'alive') {
            if (part === 'torso' || part === 'arm' || part === 'head') {
              const amp = part === 'head' ? 0.4 : 0.7;
              ox += bodySway * intensity * amp * (mode === 'sway' ? 1.2 : 0.6);
            }
          }

          if (mode === 'legs' || mode === 'alive') {
            if (part === 'leg') {
              const amp = mode === 'legs' ? 1.4 : 0.9;
              ox += legSway * intensity * amp;
              ox += legSway2 * intensity * 0.3 * (0.5 + 0.5 * Math.sin(x * 0.4));
            }
          }

          if (mode === 'alive' && part === 'leg') {
            ox += bodySway * intensity * 0.2;
          }

          const maxS = intensity * 3;
          ox = Math.max(-maxS, Math.min(maxS, ox));
          oy = Math.max(-maxS * 0.6, Math.min(maxS * 0.6, oy));

          offsets[idx] = { x: ox, y: oy };
        }
      }
      return offsets;
    }

    function drawMicroFrame(t) {
      if (!microData) return;
      const scale = parseInt(document.getElementById('microScale').value);
      const intensity = parseFloat(document.getElementById('microIntensity').value);
      const pad = Math.ceil(intensity * 3) + 8;

      const offsets = computeOffsets(t);
      for (let i = 0; i < offsets.length; i++) {
        offsets[i].x += pad;
        offsets[i].y += pad;
      }
      drawPixelBlocks(microCtx, microData, scale, offsets);
    }

    function updateMicroButtons(ready) {
      document.getElementById('btnMicroPlay').disabled = !ready || isMicroPlaying || isMicroRecording;
      document.getElementById('btnMicroRecord').disabled = !ready || isMicroPlaying || isMicroRecording;
      document.getElementById('btnMicroStop').disabled = !(isMicroPlaying || isMicroRecording);
    }

    function playMicro() {
      if (!microData || isMicroPlaying) return;
      isMicroPlaying = true;
      updateMicroButtons(false);
      document.getElementById('btnMicroStop').disabled = false;

      const duration = parseFloat(document.getElementById('microDuration').value);
      const fps = parseInt(document.getElementById('microFps').value);
      const frameTime = 1000 / fps;
      let lastTime = performance.now();
      microStartTime = performance.now();
      document.getElementById('microStatus').textContent = '播放中…';

      function loop(now) {
        if (!isMicroPlaying) return;
        if (now - lastTime >= frameTime) {
          const t = ((now - microStartTime) / 1000) % duration;
          drawMicroFrame(t);
          lastTime = now;
        }
        microAnimId = requestAnimationFrame(loop);
      }
      microAnimId = requestAnimationFrame(loop);
    }

    function stopMicro() {
      isMicroPlaying = false;
      if (microAnimId) { cancelAnimationFrame(microAnimId); microAnimId = null; }
      if (isMicroRecording && microMediaRecorder && microMediaRecorder.state !== 'inactive') {
        microMediaRecorder.stop();
      }
      isMicroRecording = false;
      updateMicroButtons(true);
      if (microData) {
        drawMicroFrame(0);
        document.getElementById('microStatus').textContent = '已停止';
      }
    }

    async function recordMicro() {
      if (!microData || isMicroRecording) return;
      if (!window.MediaRecorder) {
        alert('当前浏览器不支持 MediaRecorder，请使用 Chrome / Edge');
        return;
      }

      isMicroRecording = true;
      isMicroPlaying = true;
      updateMicroButtons(false);
      document.getElementById('btnMicroStop').disabled = false;
      microRecordedChunks = [];

      const stream = microCanvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
          ? 'video/webm;codecs=vp8' : 'video/webm';

      microMediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2500000 });
      microMediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) microRecordedChunks.push(e.data); };
      microMediaRecorder.onstop = () => {
        const blob = new Blob(microRecordedChunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'pixel-body-alive.webm'; a.click();
        URL.revokeObjectURL(url);
        isMicroRecording = false; isMicroPlaying = false;
        updateMicroButtons(true);
        document.getElementById('microStatus').textContent = '视频已下载（WebM）';
        drawMicroFrame(0);
      };
      microMediaRecorder.start(100);

      const duration = parseFloat(document.getElementById('microDuration').value);
      const fps = parseInt(document.getElementById('microFps').value);
      const frameTime = 1000 / fps;
      const totalFrames = Math.round(duration * fps);
      let frame = 0;
      let lastTime = performance.now();
      document.getElementById('microStatus').textContent = '正在录制…';

      function loop(now) {
        if (!isMicroRecording) return;
        if (now - lastTime >= frameTime) {
          drawMicroFrame((frame / totalFrames) * duration);
          frame++;
          lastTime = now;
          if (frame > totalFrames) {
            setTimeout(() => { if (microMediaRecorder && microMediaRecorder.state !== 'inactive') microMediaRecorder.stop(); }, 200);
            return;
          }
        }
        microAnimId = requestAnimationFrame(loop);
      }
      microAnimId = requestAnimationFrame(loop);
    }
  </script>
