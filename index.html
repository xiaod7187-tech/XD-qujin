<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素图工具 · 单图像素化 & 像素微动</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #111;
      color: #eee;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 60px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }
    .tab-btn {
      background: #1c1c1c;
      color: #aaa;
      border: 1px solid #333;
      padding: 10px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #6c5ce7;
      color: white;
      border-color: #6c5ce7;
    }
    .tab-btn:hover:not(.active) {
      background: #2a2a2a;
      color: #ddd;
    }

    .panel {
      display: none;
      width: 100%;
      max-width: 920px;
      flex-direction: column;
      align-items: center;
    }
    .panel.active {
      display: flex;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
      background: #1c1c1c;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid #333;
      width: 100%;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      font-size: 0.88rem;
      color: #bbb;
      white-space: nowrap;
    }
    input[type="range"] {
      width: 120px;
      accent-color: #6c5ce7;
    }
    .value {
      min-width: 32px;
      text-align: center;
      font-weight: 600;
      color: #a29bfe;
      font-size: 0.9rem;
    }
    input[type="file"] {
      display: none;
    }
    .file-btn {
      background: #2d3436;
      color: #ddd;
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.2s;
    }
    .file-btn:hover {
      background: #3d4446;
    }
    .file-name {
      font-size: 0.8rem;
      color: #888;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    select {
      background: #2d3436;
      color: #ddd;
      border: 1px solid #444;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button.action {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    button.action:hover {
      background: #5a4bd1;
    }
    button.action:active {
      transform: scale(0.97);
    }
    button.action.green {
      background: #00b894;
    }
    button.action.green:hover {
      background: #00a884;
    }
    button.action.orange {
      background: #e17055;
    }
    button.action.orange:hover {
      background: #d16045;
    }
    button.action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .canvas-wrapper {
      background: #0a0a0a;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 100%;
      overflow: auto;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      max-width: 100%;
    }
    .info {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }
    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #a29bfe;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <h1>像素图工具</h1>
  <p class="subtitle">单图像素化 · 像素图微动动画（纯前端）</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="single">单图 → 像素块</button>
    <button class="tab-btn" data-tab="micro">像素微动</button>
  </div>

  <!-- ========== 单图像素化 ========== -->
  <div class="panel active" id="panel-single">
    <div class="controls">
      <div class="control-group">
        <label class="file-btn" for="singleFile">选择图片</label>
        <input type="file" id="singleFile" accept="image/*">
        <span class="file-name" id="singleFileName">未选择</span>
      </div>

      <div class="control-group">
        <label>像素精度</label>
        <input type="range" id="singleRes" min="24" max="200" value="80" step="8">
        <span class="value" id="singleResVal">80</span>
      </div>

      <div class="control-group">
        <label>放大倍数</label>
        <input type="range" id="singleScale" min="2" max="12" value="5" step="1">
        <span class="value" id="singleScaleVal">5</span>
      </div>

      <button class="action" onclick="processSingle()">重新生成</button>
      <button class="action green" onclick="downloadSingle()">下载图片</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="singleCanvas"></canvas>
    </div>
    <p class="info">提示：精度越低，像素块越大、越抽象；精度越高，越接近原图。</p>
  </div>

  <!-- ========== 像素微动 ========== -->
  <div class="panel" id="panel-micro">
    <div class="controls">
      <div class="control-group">
        <label class="file-btn" for="microFile">选择图片</label>
        <input type="file" id="microFile" accept="image/*">
        <span class="file-name" id="microFileName">未选择</span>
      </div>

      <div class="control-group">
        <label>像素精度</label>
        <input type="range" id="microRes" min="24" max="160" value="64" step="8">
        <span class="value" id="microResVal">64</span>
      </div>

      <div class="control-group">
        <label>放大倍数</label>
        <input type="range" id="microScale" min="2" max="10" value="5" step="1">
        <span class="value" id="microScaleVal">5</span>
      </div>

      <div class="control-group">
        <label>晃动强度</label>
        <input type="range" id="microIntensity" min="0.5" max="6" value="2" step="0.5">
        <span class="value" id="microIntensityVal">2</span>
      </div>

      <div class="control-group">
        <label>速度</label>
        <input type="range" id="microSpeed" min="0.3" max="3" value="1" step="0.1">
        <span class="value" id="microSpeedVal">1.0</span>
      </div>
    </div>

    <div class="controls" style="margin-top:-6px;">
      <div class="control-group">
        <label>微动模式</label>
        <select id="microMode">
          <option value="wave">波浪浮动</option>
          <option value="jiggle">随机抖动</option>
          <option value="breathe">呼吸缩放</option>
          <option value="ripple">涟漪扩散</option>
        </select>
      </div>

      <div class="control-group">
        <label>时长(秒)</label>
        <input type="range" id="microDuration" min="2" max="12" value="4" step="0.5">
        <span class="value" id="microDurationVal">4</span>
      </div>

      <div class="control-group">
        <label>帧率</label>
        <input type="range" id="microFps" min="12" max="30" value="20" step="1">
        <span class="value" id="microFpsVal">20</span>
      </div>

      <button class="action" id="btnMicroPlay" onclick="playMicro()" disabled>播放预览</button>
      <button class="action orange" id="btnMicroRecord" onclick="recordMicro()" disabled>录制并下载视频</button>
      <button class="action" id="btnMicroStop" onclick="stopMicro()" disabled style="background:#636e72;">停止</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="microCanvas"></canvas>
    </div>
    <p class="status" id="microStatus">请先上传图片</p>
    <p class="info">
      波浪浮动：像素块随正弦波上下左右轻柔移动。<br>
      随机抖动：每个像素块有独立的轻微随机偏移。<br>
      呼吸缩放：整体像素块轻微放大缩小，有生命感。<br>
      涟漪扩散：从中心向外扩散的波纹位移。<br>
      录制输出 WebM（Chrome / Edge 最佳）。
    </p>
  </div>

  <script>
    // ==================== 通用工具 ====================
    function loadImageFromFile(file) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error('无文件'));
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片加载失败'));
        };
        img.src = url;
      });
    }

    function getPixelData(img, w, h) {
      const temp = document.createElement('canvas');
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext('2d');
      tctx.imageSmoothingEnabled = false;
      tctx.drawImage(img, 0, 0, w, h);
      return tctx.getImageData(0, 0, w, h);
    }

    function drawPixelBlocks(ctx, imageData, scale, offsets = null) {
      const w = imageData.width;
      const h = imageData.height;
      const data = imageData.data;
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          const a = data[i + 3] / 255;
          if (a < 0.01) continue;

          let ox = 0, oy = 0, s = scale;
          if (offsets) {
            const o = offsets[y * w + x];
            if (o) {
              ox = o.x || 0;
              oy = o.y || 0;
              if (o.s !== undefined) s = o.s;
            }
          }

          ctx.fillStyle = `rgba(${data[i]},${data[i+1]},${data[i+2]},${a})`;
          ctx.fillRect(
            Math.round(x * scale + ox),
            Math.round(y * scale + oy),
            Math.max(1, Math.round(s)),
            Math.max(1, Math.round(s))
          );
        }
      }
    }

    // 确定性伪随机（0~1）
    function pixelThreshold(x, y, seed = 0) {
      let n = x * 374761393 + y * 668265263 + seed * 982451653;
      n = (n ^ (n >>> 13)) * 1274126177;
      n = n ^ (n >>> 16);
      return (n >>> 0) / 4294967295;
    }

    // ==================== 标签切换 ====================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        // 切换时停止微动动画
        if (btn.dataset.tab !== 'micro') stopMicro();
      });
    });

    // ==================== 单图像素化 ====================
    let singleImg = null;
    const singleCanvas = document.getElementById('singleCanvas');
    const singleCtx = singleCanvas.getContext('2d');

    document.getElementById('singleFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('singleFileName').textContent = file.name;
      try {
        singleImg = await loadImageFromFile(file);
        processSingle();
      } catch (err) {
        alert('图片加载失败');
      }
    });

    document.getElementById('singleRes').oninput = (e) => {
      document.getElementById('singleResVal').textContent = e.target.value;
    };
    document.getElementById('singleScale').oninput = (e) => {
      document.getElementById('singleScaleVal').textContent = e.target.value;
    };

    function processSingle() {
      if (!singleImg) return;
      const targetW = parseInt(document.getElementById('singleRes').value);
      const scale = parseInt(document.getElementById('singleScale').value);
      const aspect = singleImg.height / singleImg.width;
      const w = targetW;
      const h = Math.max(1, Math.round(targetW * aspect));

      const imageData = getPixelData(singleImg, w, h);
      singleCanvas.width = w * scale;
      singleCanvas.height = h * scale;
      singleCtx.imageSmoothingEnabled = false;
      drawPixelBlocks(singleCtx, imageData, scale);
    }

    function downloadSingle() {
      if (!singleImg) return;
      const link = document.createElement('a');
      link.download = 'pixel-art.png';
      link.href = singleCanvas.toDataURL('image/png');
      link.click();
    }

    // ==================== 像素微动 ====================
    let microImg = null;
    let microData = null;
    let microW = 0, microH = 0;
    let microAnimId = null;
    let isMicroPlaying = false;
    let isMicroRecording = false;
    let microMediaRecorder = null;
    let microRecordedChunks = [];
    let microStartTime = 0;

    const microCanvas = document.getElementById('microCanvas');
    const microCtx = microCanvas.getContext('2d');

    // 控件事件
    document.getElementById('microRes').oninput = (e) => {
      document.getElementById('microResVal').textContent = e.target.value;
      prepareMicroData();
    };
    document.getElementById('microScale').oninput = (e) => {
      document.getElementById('microScaleVal').textContent = e.target.value;
      prepareMicroData();
    };
    document.getElementById('microIntensity').oninput = (e) => {
      document.getElementById('microIntensityVal').textContent = e.target.value;
    };
    document.getElementById('microSpeed').oninput = (e) => {
      document.getElementById('microSpeedVal').textContent = parseFloat(e.target.value).toFixed(1);
    };
    document.getElementById('microDuration').oninput = (e) => {
      document.getElementById('microDurationVal').textContent = e.target.value;
    };
    document.getElementById('microFps').oninput = (e) => {
      document.getElementById('microFpsVal').textContent = e.target.value;
    };
    document.getElementById('microMode').onchange = () => {
      if (microData) drawMicroFrame(0);
    };

    document.getElementById('microFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('microFileName').textContent = file.name;
      try {
        microImg = await loadImageFromFile(file);
        prepareMicroData();
      } catch (err) {
        alert('图片加载失败');
      }
    });

    function prepareMicroData() {
      if (!microImg) {
        updateMicroButtons(false);
        document.getElementById('microStatus').textContent = '请先上传图片';
        return;
      }

      const targetW = parseInt(document.getElementById('microRes').value);
      const scale = parseInt(document.getElementById('microScale').value);
      const intensity = parseFloat(document.getElementById('microIntensity').value);

      const aspect = microImg.height / microImg.width;
      microW = targetW;
      microH = Math.max(1, Math.round(targetW * aspect));

      microData = getPixelData(microImg, microW, microH);

      // 留出晃动边距，避免像素被裁切
      const pad = Math.ceil(intensity * 2) + 4;
      microCanvas.width = microW * scale + pad * 2;
      microCanvas.height = microH * scale + pad * 2;
      microCtx.imageSmoothingEnabled = false;

      drawMicroFrame(0);

      updateMicroButtons(true);
      document.getElementById('microStatus').textContent = `已就绪：${microW}×${microH} 像素 · 可播放或录制`;
    }

    // t: 时间（秒）
    function computeOffsets(t) {
      const mode = document.getElementById('microMode').value;
      const intensity = parseFloat(document.getElementById('microIntensity').value);
      const speed = parseFloat(document.getElementById('microSpeed').value);
      const scale = parseInt(document.getElementById('microScale').value);
      const w = microW, h = microH;
      const offsets = new Array(w * h);

      const cx = (w - 1) / 2;
      const cy = (h - 1) / 2;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          let ox = 0, oy = 0, s = scale;

          if (mode === 'wave') {
            // 波浪：x/y 方向不同相位的正弦
            const phaseX = x * 0.35 + t * speed * 2.2;
            const phaseY = y * 0.28 + t * speed * 1.8;
            ox = Math.sin(phaseX) * intensity * 1.2;
            oy = Math.cos(phaseY) * intensity * 1.0;
          } else if (mode === 'jiggle') {
            // 每个像素独立的随机抖动（平滑过渡）
            const seed1 = pixelThreshold(x, y, 11);
            const seed2 = pixelThreshold(x, y, 77);
            ox = Math.sin(t * speed * 3.1 + seed1 * 20) * intensity * (0.6 + seed1 * 0.8);
            oy = Math.cos(t * speed * 2.7 + seed2 * 18) * intensity * (0.6 + seed2 * 0.8);
          } else if (mode === 'breathe') {
            // 呼吸：整体缩放 + 轻微位置偏移
            const breathe = 1 + Math.sin(t * speed * 1.5) * (intensity * 0.08);
            s = scale * breathe;
            // 向中心轻微收缩
            ox = (x - cx) * (breathe - 1) * scale * 0.5;
            oy = (y - cy) * (breathe - 1) * scale * 0.5;
          } else if (mode === 'ripple') {
            // 涟漪：从中心向外
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const wave = Math.sin(dist * 0.55 - t * speed * 4.5);
            const amp = intensity * (1.2 - Math.min(1, dist / Math.max(cx, cy)) * 0.5);
            const angle = Math.atan2(dy, dx);
            ox = Math.cos(angle) * wave * amp;
            oy = Math.sin(angle) * wave * amp;
          }

          offsets[idx] = { x: ox, y: oy, s };
        }
      }
      return offsets;
    }

    function drawMicroFrame(t) {
      if (!microData) return;
      const scale = parseInt(document.getElementById('microScale').value);
      const intensity = parseFloat(document.getElementById('microIntensity').value);
      const pad = Math.ceil(intensity * 2) + 4;

      const offsets = computeOffsets(t);

      // 把偏移整体平移到有边距的位置
      for (let i = 0; i < offsets.length; i++) {
        offsets[i].x += pad;
        offsets[i].y += pad;
      }

      drawPixelBlocks(microCtx, microData, scale, offsets);
    }

    function updateMicroButtons(ready) {
      document.getElementById('btnMicroPlay').disabled = !ready || isMicroPlaying || isMicroRecording;
      document.getElementById('btnMicroRecord').disabled = !ready || isMicroPlaying || isMicroRecording;
      document.getElementById('btnMicroStop').disabled = !(isMicroPlaying || isMicroRecording);
    }

    function playMicro() {
      if (!microData || isMicroPlaying) return;
      isMicroPlaying = true;
      updateMicroButtons(false);
      document.getElementById('btnMicroStop').disabled = false;

      const duration = parseFloat(document.getElementById('microDuration').value);
      const fps = parseInt(document.getElementById('microFps').value);
      const frameTime = 1000 / fps;
      let lastTime = performance.now();
      microStartTime = performance.now();

      document.getElementById('microStatus').textContent = '播放中…';

      function loop(now) {
        if (!isMicroPlaying) return;
        if (now - lastTime >= frameTime) {
          const elapsed = (now - microStartTime) / 1000;
          const t = elapsed % duration; // 循环播放
          drawMicroFrame(t);
          lastTime = now;
        }
        microAnimId = requestAnimationFrame(loop);
      }
      microAnimId = requestAnimationFrame(loop);
    }

    function stopMicro() {
      isMicroPlaying = false;
      if (microAnimId) {
        cancelAnimationFrame(microAnimId);
        microAnimId = null;
      }
      if (isMicroRecording && microMediaRecorder && microMediaRecorder.state !== 'inactive') {
        microMediaRecorder.stop();
      }
      isMicroRecording = false;
      updateMicroButtons(true);
      if (microData) {
        drawMicroFrame(0);
        document.getElementById('microStatus').textContent = '已停止';
      }
    }

    async function recordMicro() {
      if (!microData || isMicroRecording) return;

      if (!window.MediaRecorder) {
        alert('当前浏览器不支持 MediaRecorder，请使用 Chrome / Edge / Firefox');
        return;
      }

      isMicroRecording = true;
      isMicroPlaying = true;
      updateMicroButtons(false);
      document.getElementById('btnMicroStop').disabled = false;
      microRecordedChunks = [];

      const stream = microCanvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
        ? 'video/webm;codecs=vp9'
        : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
          ? 'video/webm;codecs=vp8'
          : 'video/webm';

      microMediaRecorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 2500000
      });

      microMediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) microRecordedChunks.push(e.data);
      };

      microMediaRecorder.onstop = () => {
        const blob = new Blob(microRecordedChunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pixel-micro-motion.webm';
        a.click();
        URL.revokeObjectURL(url);
        isMicroRecording = false;
        isMicroPlaying = false;
        updateMicroButtons(true);
        document.getElementById('microStatus').textContent = '视频已下载（WebM）';
        drawMicroFrame(0);
      };

      microMediaRecorder.start(100);

      const duration = parseFloat(document.getElementById('microDuration').value);
      const fps = parseInt(document.getElementById('microFps').value);
      const frameTime = 1000 / fps;
      const totalFrames = Math.round(duration * fps);
      let frame = 0;
      let lastTime = performance.now();
      microStartTime = performance.now();

      document.getElementById('microStatus').textContent = '正在录制…';

      function loop(now) {
        if (!isMicroRecording) return;
        if (now - lastTime >= frameTime) {
          const t = (frame / totalFrames) * duration;
          drawMicroFrame(t);
          frame++;
          lastTime = now;
          if (frame > totalFrames) {
            setTimeout(() => {
              if (microMediaRecorder && microMediaRecorder.state !== 'inactive') {
                microMediaRecorder.stop();
              }
            }, 200);
            return;
          }
        }
        microAnimId = requestAnimationFrame(loop);
      }
      microAnimId = requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
