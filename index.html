<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>小妲的取金游戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    height:100dvh;
    background:#0a0612;
    color:#f3e8ff;
    font-family:"Noto Serif SC","PingFang SC","Microsoft YaHei",serif;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* ========== 开场全屏视频 ========== */
  .intro{
    position:fixed;
    inset:0;
    z-index:100;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .intro.hide{display:none}
  .intro video{
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
  }
  .intro .title-overlay{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-family:"Ma Shan Zheng","ZCOOL XiaoWei",serif;
    font-size:clamp(1.7rem,6.5vw,2.5rem);
    color:#fff5fb;
    letter-spacing:5px;
    text-shadow:
      0 0 18px rgba(249,168,212,.95),
      0 0 40px rgba(232,121,249,.7),
      0 4px 12px rgba(0,0,0,.8);
    pointer-events:none;
    white-space:nowrap;
    animation:titleGlow 2.4s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{opacity:.92}
    50%{opacity:1}
  }
  .intro .tap-hint{
    position:absolute;
    bottom:max(28px, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    font-family:"ZCOOL XiaoWei",serif;
    font-size:clamp(.9rem,2.8vw,1.05rem);
    color:rgba(255,240,255,.9);
    text-shadow:0 0 12px rgba(249,168,212,.8), 0 2px 6px rgba(0,0,0,.7);
    letter-spacing:2px;
    animation:pulseHint 1.6s ease-in-out infinite;
    pointer-events:none;
    white-space:nowrap;
  }
  @keyframes pulseHint{
    0%,100%{opacity:.7; transform:translateX(-50%) scale(1)}
    50%{opacity:1; transform:translateX(-50%) scale(1.05)}
  }

  /* ========== 主框架 ========== */
  .atm{
    width:100%;
    max-width:420px;
    height:100%;
    height:100dvh;
    max-height:900px;
    background:#1a1028 url(main-frame.png) center/cover no-repeat;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }

  /* 顶部状态栏 —— 只显示数字，文字在图片里 */
  .atm-top{
    flex-shrink:0;
    height:clamp(52px, 8.5vh, 68px);
    background:url(top-bar.png) center/100% 100% no-repeat;
    position:relative;
    z-index:5;
  }
  .atm-top .bal{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .atm-top .bal .pts-num,
  .atm-top .bal .paid-num{
    position:absolute;
    top:62%;
    transform:translate(-50%,-50%);
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:clamp(.78rem, 2.4vw, .94rem);
    font-weight:400;
    color:#fff5fb;
    text-shadow:
      0 0 6px rgba(255,182,255,.95),
      0 0 12px rgba(232,121,249,.7),
      0 1px 2px rgba(0,0,0,.7);
    min-width:2em;
    text-align:center;
    letter-spacing:.5px;
    line-height:1;
  }
  .atm-top .bal .pts-num{left:55%;}
  .atm-top .bal .paid-num{left:77%;}

  /* 主内容区 —— 加大顶部内边距，避开装饰边框 */
  .screen{
    flex:1;
    min-height:0;
    margin:clamp(6px,1.4vw,10px) clamp(12px,3.5vw,18px) 0;
    background:url(content-frame.png) center/100% 100% no-repeat;
    /* 关键：顶部留足空间，避免文字被装饰框裁切 */
    padding:clamp(28px,5.5vh,42px) clamp(18px,4.5vw,26px) clamp(16px,3vh,22px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    position:relative;
    z-index:2;
  }
  .screen h2{
    text-align:center;
    font-family:"Ma Shan Zheng","ZCOOL XiaoWei",serif;
    font-size:clamp(1.1rem,3.2vw,1.3rem);
    color:#fce7f3;
    letter-spacing:3px;
    margin-bottom:clamp(8px,1.8vw,14px);
    font-weight:400;
    text-shadow:
      0 0 12px rgba(251,207,232,.8),
      0 0 20px rgba(244,114,182,.4),
      0 2px 4px rgba(0,0,0,.5);
  }
  .screen .txt{
    font-size:clamp(.8rem,2.3vw,.9rem);
    line-height:1.7;
    color:#f5e6ff;
    white-space:pre-wrap;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .screen .txt em{
    color:#fda4d4;
    font-style:normal;
    font-weight:600;
    text-shadow:0 0 8px rgba(249,168,212,.5);
  }
  .screen .txt strong{
    color:#fbcfe8;
    font-weight:700;
  }

  /* 对话框 —— 顶部装饰条需足够内边距 */
  .clerk{
    flex-shrink:0;
    margin:clamp(4px,1vw,8px) clamp(10px,3vw,16px) clamp(4px,1vw,6px);
    min-height:clamp(78px,13vh,100px);
    background:url(dialog-box.png) center/100% 100% no-repeat;
    /* 加大顶部内边距，让文字落在内容区而不是被名字装饰条遮挡 */
    padding:clamp(32px,5.2vh,44px) clamp(16px,4vw,22px) clamp(12px,2.2vh,16px);
    font-family:"Noto Serif SC","PingFang SC",serif;
    font-size:clamp(.76rem,2.2vw,.86rem);
    line-height:1.55;
    color:#2a1548;
    white-space:pre-wrap;
    position:relative;
    z-index:3;
    font-weight:500;
  }

  /* 按钮区 —— 简洁两列 */
  .pad{
    flex-shrink:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(8px,2vw,12px);
    padding:0 clamp(12px,3.5vw,18px) clamp(10px,2.5vh,18px);
    padding-bottom:max(clamp(10px,2.5vh,18px), env(safe-area-inset-bottom));
    position:relative;
    z-index:4;
  }
  .pad button{
    height:clamp(44px,7.2vh,52px);
    border:none;
    background-color:transparent;
    background-image:url(btn-normal.png);
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    color:#fff8ff;
    font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;
    font-size:clamp(.82rem,2.4vw,.93rem);
    font-weight:400;
    cursor:pointer;
    min-height:44px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.55), 0 0 8px rgba(255,200,255,.3);
    letter-spacing:1px;
    -webkit-appearance:none;
    appearance:none;
    transition:transform .1s cubic-bezier(.2,.8,.2,1), filter .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(91,33,182,.35);
    user-select:none;
    -webkit-user-select:none;
  }
  .pad button:active{
    transform:translateY(3px) scale(.97);
    filter:brightness(1.08);
    box-shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 6px rgba(91,33,182,.25);
  }
  .pad button:focus-visible{
    outline:2px solid #f9a8d4;
    outline-offset:2px;
  }
  .pad button.main{
    grid-column:1/-1;
    height:clamp(48px,7.8vh,56px);
    font-size:clamp(.9rem,2.6vw,1.02rem);
    letter-spacing:2px;
  }
  .pad button.pink{
    background-image:url(btn-pink.png);
    box-shadow:0 4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(190,24,93,.4);
  }
  .pad button.pink:active{
    box-shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 6px rgba(190,24,93,.3);
  }
  .pad button.gold{
    background-image:url(btn-gold.png);
    color:#fffef5;
    text-shadow:0 1px 3px rgba(80,40,0,.55), 0 0 10px rgba(251,191,36,.45);
    box-shadow:0 4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(180,83,9,.45);
  }
  .pad button.gold:active{
    box-shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 6px rgba(180,83,9,.35);
  }
  .pad button.dim{
    background-image:url(btn-disabled.png);
    opacity:.92;
    font-size:clamp(.74rem,2.1vw,.84rem);
    color:#e9d5ff;
    text-shadow:0 1px 2px rgba(0,0,0,.35);
    box-shadow:0 3px 0 rgba(0,0,0,.2), 0 4px 8px rgba(0,0,0,.25);
    cursor:default;
  }
  .pad button.dim:active{
    transform:translateY(2px) scale(.98);
    filter:brightness(1.05);
  }
  .pad button.full{grid-column:1/-1}

  input{
    width:100%;
    padding:clamp(10px,2.4vw,13px) clamp(12px,3vw,14px);
    margin:clamp(6px,1.5vw,9px) 0;
    border:1.5px solid #d8b4fe;
    border-radius:12px;
    background:rgba(30,15,55,.85);
    color:#fce7f3;
    font-family:"Noto Serif SC",serif;
    font-size:clamp(.84rem,2.4vw,.93rem);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus{
    border-color:#f9a8d4;
    box-shadow:0 0 0 3px rgba(249,168,212,.28);
  }
  input::placeholder{color:#c4b5fd}

  /* 顶部小标签（存金/取金/取精）—— 精简尺寸 */
  .wins{
    display:flex;
    gap:clamp(5px,1.5vw,8px);
    justify-content:center;
    margin:0 0 clamp(8px,1.8vw,12px);
    flex-wrap:wrap;
  }
  .wins span{
    font-family:"ZCOOL XiaoWei",serif;
    font-size:clamp(.68rem,2vw,.78rem);
    padding:clamp(3px,1vw,5px) clamp(10px,2.8vw,14px);
    border-radius:16px;
    background:linear-gradient(180deg,#5b21b6,#3b0764);
    color:#e9d5ff;
    border:1.5px solid #a78bfa;
    box-shadow:0 2px 6px rgba(91,33,182,.4);
    letter-spacing:1px;
  }
  .wins span.on{
    color:#fff;
    border-color:#fda4d4;
    background:linear-gradient(180deg,#db2777,#9d174d);
    box-shadow:0 0 12px rgba(244,114,182,.5);
    text-shadow:0 0 6px rgba(255,200,230,.5);
  }

  /* 支付弹层 */
  .mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,4,18,.9);
    z-index:50;
    align-items:center;
    justify-content:center;
    padding:16px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    animation:fadeIn .25s ease;
  }
  .mask.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .box{
    background:linear-gradient(160deg,#3b1f5e 0%,#1a0f2e 100%);
    border:2px solid #e9d5ff;
    border-radius:16px;
    padding:clamp(16px,4vw,22px) clamp(14px,3.5vw,18px);
    max-width:320px;
    width:100%;
    text-align:center;
    box-shadow:0 0 0 1px #f9a8d4,0 12px 36px rgba(91,33,182,.55);
    animation:popIn .28s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes popIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .box h3{
    font-family:"Ma Shan Zheng","ZCOOL XiaoWei",serif;
    color:#fce7f3;
    font-size:clamp(1rem,2.8vw,1.15rem);
    margin-bottom:6px;
    letter-spacing:2px;
    text-shadow:0 0 10px rgba(251,207,232,.55);
  }
  .box .amt{
    font-family:"ZCOOL XiaoWei",serif;
    color:#fda4d4;
    font-size:clamp(1.3rem,4vw,1.55rem);
    margin:6px 0;
    text-shadow:0 0 14px rgba(249,168,212,.6);
  }
  .box .tip{
    color:#e9d5ff;
    font-size:clamp(.76rem,2.2vw,.85rem);
    margin-bottom:12px;
    line-height:1.55;
  }
  .qrs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .qrs p{font-size:clamp(.66rem,1.9vw,.74rem);color:#d8b4fe;margin-bottom:4px}
  .qrs img{
    width:clamp(100px,28vw,118px);
    height:clamp(100px,28vw,118px);
    object-fit:contain;
    background:#fff;
    border-radius:10px;
    border:1.5px solid #e9d5ff;
  }
  .box .ok{
    width:100%;
    padding:clamp(11px,2.8vw,14px);
    border:none;
    border-radius:12px;
    background:url(btn-normal.png) center/100% 100% no-repeat;
    color:#fff8ff;
    font-family:"ZCOOL XiaoWei",serif;
    font-size:clamp(.88rem,2.5vw,.98rem);
    letter-spacing:1px;
    cursor:pointer;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
    box-shadow:0 4px 0 rgba(0,0,0,.25), 0 6px 14px rgba(91,33,182,.35);
    transition:transform .1s, box-shadow .12s, filter .12s;
  }
  .box .ok:active{
    transform:translateY(3px) scale(.97);
    filter:brightness(1.08);
    box-shadow:0 1px 0 rgba(0,0,0,.2), 0 2px 6px rgba(91,33,182,.25);
  }

  /* 倒计时全屏 */
  .timer{
    display:none;
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center,#2a1a3d 0%,#0a0612 70%);
    z-index:40;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px;
    padding-bottom:max(16px, env(safe-area-inset-bottom));
    animation:fadeIn .3s ease;
  }
  .timer.show{display:flex}
  .timer .lab{
    font-family:"Ma Shan Zheng","ZCOOL XiaoWei",serif;
    color:#fce7f3;
    letter-spacing:4px;
    margin-bottom:8px;
    font-size:clamp(1.15rem,3.4vw,1.35rem);
    text-shadow:0 0 14px rgba(251,207,232,.65);
  }
  .timer .num{
    font-family:"ZCOOL XiaoWei",serif;
    font-size:clamp(3.4rem,13vw,4.3rem);
    color:#fda4d4;
    font-variant-numeric:tabular-nums;
    margin:8px 0;
    text-shadow:0 0 24px rgba(249,168,212,.65);
  }
  .timer .hint{
    margin-top:12px;
    text-align:center;
    color:#e9d5ff;
    font-size:clamp(.85rem,2.5vw,.96rem);
    white-space:pre-wrap;
    line-height:1.7;
    max-width:280px;
  }
  .timer .gif-wrap{
    width:min(260px,75vw);
    max-height:34vh;
    margin:10px 0;
    border-radius:14px;
    overflow:hidden;
    border:2px solid #e9d5ff;
    background:#160f24;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 24px rgba(124,58,237,.35);
  }
  .timer .gif-wrap img{width:100%;height:100%;object-fit:contain;display:block}

  .svc-list{margin:6px 0}
  .svc-list div{
    padding:clamp(5px,1.4vw,8px) 0;
    border-bottom:1px dashed #7c3aed;
    font-size:clamp(.8rem,2.3vw,.9rem);
    color:#f5e6ff;
  }
  .svc-list .cost{
    color:#fda4d4;
    font-weight:600;
    text-shadow:0 0 5px rgba(249,168,212,.35);
  }

  .agree-box{
    background:rgba(45,20,80,.6);
    border:1.5px solid #a78bfa;
    border-radius:12px;
    padding:12px 14px;
    margin:8px 0;
    font-size:clamp(.74rem,2.1vw,.84rem);
    line-height:1.65;
    color:#f5e6ff;
    max-height:38vh;
    overflow-y:auto;
  }
  .agree-box p{margin-bottom:8px}
  .agree-box p:last-child{margin-bottom:0}
  .agree-box strong{color:#fda4d4}

  /* 小屏适配 */
  @media (max-height:640px){
    .atm-top{height:48px}
    .atm-top .bal .pts-num,
    .atm-top .bal .paid-num{font-size:.74rem; top:64%}
    .screen{padding-top:24px; padding-bottom:12px}
    .clerk{min-height:70px; padding-top:28px}
    .pad{gap:6px; padding-bottom:8px}
    .pad button{height:40px; font-size:.76rem}
    .pad button.main{height:44px}
    .screen h2{font-size:1.02rem; margin-bottom:6px}
  }
  @media (max-width:360px){
    .atm-top .bal .pts-num{left:54%}
    .atm-top .bal .paid-num{left:76%}
    .qrs img{width:96px; height:96px}
    .screen{padding-left:14px; padding-right:14px}
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <video id="introVideo" src="1.mp4" autoplay muted loop playsinline webkit-playsinline></video>
  <div class="title-overlay">小妲的取金游戏</div>
  <div class="tap-hint">点击屏幕进入游戏</div>
</div>

<div class="atm">
  <div class="atm-top">
    <div class="bal">
      <span class="pts-num" id="pts">0</span>
      <span class="paid-num" id="paid">0</span>
    </div>
  </div>
  <div class="screen">
    <h2 id="title">系统启动</h2>
    <div class="txt" id="body">请稍候…</div>
  </div>
  <div class="clerk" id="clerk">……</div>
  <div class="pad" id="pad"></div>
</div>

<div class="mask" id="pay">
  <div class="box">
    <h3>请选择支付宝或者微信支付</h3>
    <div class="amt" id="payAmt">¥ —</div>
    <p class="tip" id="payTip">让我来看看你到底有多听话❤️</p>
    <div class="qrs">
      <div><p>支付宝扫码存金</p><img src="https://i.postimg.cc/SNh3sQBR/IMG-20260721-005325.jpg" alt="支付宝"></div>
      <div><p>微信扫码存金</p><img src="https://i.postimg.cc/ht4YLyP8/IMG-20260721-005339.png" alt="微信"></div>
    </div>
    <button type="button" class="ok" id="btnPaid">已存金 / 继续</button>
  </div>
</div>

<div class="timer" id="timer">
  <div class="lab" id="tLab">取精体验</div>
  <div class="gif-wrap" id="tGifWrap">
    <img id="tGif" src="" alt="服务画面">
  </div>
  <div class="num" id="tNum">5</div>
  <div class="hint" id="tHint"></div>
</div>

<script>
(function(){
  var points=0, paid=0, pending=0, cb=null, playerName="";

  var title=document.getElementById('title');
  var body=document.getElementById('body');
  var clerk=document.getElementById('clerk');
  var pad=document.getElementById('pad');
  var intro=document.getElementById('intro');
  var introVideo=document.getElementById('introVideo');

  var SVC={
    smell:{name:'闻脚',cost:10,sec:8,gif:'1.gif',
      hint:'把脸凑近。\n只能闻，不准碰。\n深呼吸。\n记住这个味道。'},
    lick:{name:'舔脚',cost:30,sec:12,gif:'2.gif',
      hint:'从脚尖到脚心。\n慢慢舔。\n舌头要软，动作要轻。\n时间到必须停。'},
    foot:{name:'足交',cost:50,sec:18,gif:'3.gif',
      hint:'脚掌压住。\n慢慢动。\n倒计时结束前不准射。\n忍住。'},
    climax:{name:'射精',cost:100,sec:10,gif:'4.gif',
      hint:'终于到这一步了。\n尽情释放吧。\n时间到必须停下。\n好好记住现在的感觉。'}
  };

  function enterGame(){
    intro.classList.add('hide');
    try{ introVideo.pause(); }catch(e){}
    boot();
  }
  intro.addEventListener('click', enterGame);
  intro.addEventListener('touchend', function(e){
    e.preventDefault();
    enterGame();
  }, {passive:false});
  introVideo.play().catch(function(){});

  function bal(){
    document.getElementById('pts').textContent=points;
    document.getElementById('paid').textContent=paid;
  }
  function say(t){clerk.textContent=t;}
  function wins(on){
    var a=['存金','取金','取精'],h='<div class="wins">';
    a.forEach(function(n){h+='<span class="'+(n===on?'on':'')+'">'+n+'</span>';});
    return h+'</div>';
  }
  function view(t,html){title.textContent=t;body.innerHTML=html;}
  function keys(list){
    pad.innerHTML='';
    list.forEach(function(it){
      var b=document.createElement('button');
      b.textContent=it.l;
      var cls=[];
      if(it.main)cls.push('main');
      if(it.pink)cls.push('pink');
      if(it.gold)cls.push('gold');
      if(it.dim)cls.push('dim');
      if(it.full)cls.push('full');
      if(cls.length)b.className=cls.join(' ');
      b.onclick=it.f;
      pad.appendChild(b);
    });
  }
  function openPay(amt,fn){
    pending=amt;cb=fn;
    document.getElementById('payAmt').textContent='¥ '+amt;
    var tip='';
    if(amt>=100) tip='一百……看起来很有诚意呢。\n扫完码，我会好好看着你的。';
    else if(amt>=50) tip='五十啊……还算听话。\n继续表现，我会给你更多。';
    else tip='只有十块？\n就这点诚意？\n扫吧，扫完再说话。';
    document.getElementById('payTip').textContent=tip;
    document.getElementById('pay').classList.add('show');
  }
  document.getElementById('btnPaid').onclick=function(){
    document.getElementById('pay').classList.remove('show');
    var a=pending,f=cb;pending=0;cb=null;
    if(!a)return;
    paid+=a;points+=a;bal();
    if(f)f(a);
  };

  function runTimer(lab,sec,hint,gifSrc,done){
    var m=document.getElementById('timer');
    document.getElementById('tLab').textContent=lab;
    document.getElementById('tHint').textContent=hint;
    var img=document.getElementById('tGif');
    if(gifSrc){
      img.src=gifSrc+'?t='+Date.now();
      img.style.display='block';
      document.getElementById('tGifWrap').style.display='flex';
    }else{
      img.src='';
      document.getElementById('tGifWrap').style.display='none';
    }
    var num=document.getElementById('tNum');
    var left=sec;num.textContent=left;
    m.classList.add('show');
    var id=setInterval(function(){
      left--;num.textContent=Math.max(0,left);
      if(left<=0){
        clearInterval(id);
        m.classList.remove('show');
        img.src='';
        if(done)done();
      }
    },1000);
  }

      '<div class="agree-box">'+
      '<p><strong>贡奴守则</strong></p>'+
      '<p>· <strong>存金</strong>：用积分证明你的诚意。存得越多，小妲越愿意多看你一眼。</p>'+
      '<p>· <strong>取精服务</strong>：闻脚、舔脚、足交、射精。每一次都是奖励，时间到必须停。</p>'+
      '<p>· <strong>取金</strong>：暂时因不可抗力暂停。</p>'+
      '<p>· 注册后会得到一次免费的5秒体验。之后，想要更多，就只能自己存。</p>'+

    say('规则看明白了吗？\n看明白就去登记。');

  function login(){
    view('贡奴登记',
      wins('存金')+
      '在这里写下你的名字。\n\n'+
      '不是玩家ID，是你作为贡奴的称呼。\n'+
      '之后小妲会这样叫你。\n\n'+
      '再设一个六位数字，只是用来记住你自己的。\n\n'+
      '<input id="u" placeholder="你的名字 / 小名" maxlength="12">'+
      '<input id="p" type="password" placeholder="6位数字（仅作记忆）" maxlength="6" inputmode="numeric">'
    );
    say('写清楚。\n写完，你就正式是贡奴了。');
    keys([{l:'登记并跪下',main:1,pink:1,f:function(){
      var u=(document.getElementById('u').value||'').trim();
      var p=(document.getElementById('p').value||'').trim();
      if(!u){alert('名字呢？');return;}
      if(p.length<4){alert('至少写四个数字。');return;}
      playerName=u;
      points=10;bal();
      gift();
    }}]);
  }

  function gift(){
    view('登记完成',
      wins('存金')+
      '「'+playerName+'」……\n\n'+
      '登记完成。\n作为新来的贡奴，小妲给你一次免费的5秒体验。\n\n'+
      '当前积分：<em>10</em>\n\n'+
      '只有五秒。\n够你闻一口，不够你真正满足。\n\n'+
      '<strong>记住这种刚刚开始就被掐断的感觉。</strong>'
    );
    say('去吧。\n先体验一次，再决定要不要继续跪。');
    keys([{l:'去取精体验室',main:1,pink:1,f:toEdge}]);
  }

  function toEdge(){
    view('取精体验室',
      wins('取精')+
      '这里就是小妲的取精室。\n\n'+
      '你有10积分，可以免费体验一次。\n时长：只有5秒。\n\n'+
      '小妲会把脚伸过来，让你闻。\n然后时间一到，立刻收回。\n\n'+
      '<em>「想要更久？那就自己存金。」</em>'
    );
    say('准备好了就说。\n只有一次免费。');
    keys([{l:'开始5秒体验',pink:1,full:1,f:sec5}]);
  }

  function sec5(){
    points=Math.max(0,points-10);bal();
    runTimer('5秒免费体验',5,
      '把脸凑近。\n只能闻，不准碰。\n好好记住这个味道。\n时间到，必须停。',
      '1.gif',
      function(){
        view('体验结束',
          wins('取精')+
          '五秒已经结束。\n\n'+
          '脚被收回去了。\n房间里只剩下你自己和那点还没散尽的气味。\n\n'+
          '积分已用完。\n\n'+
          '<strong>想要更久？\n想要舔？想要被踩？想要射？</strong>\n\n'+
          '那就去存金。\n没有第二条路。'
        );
        say('感觉到了吗？\n刚刚开始就被掐断的感觉。\n想要更多，就自己存。');
        keys([
          {l:'去存金',main:1,pink:1,f:deposit},
          {l:'……我先不存',dim:1,full:1,f:poor}
        ]);
      }
    );
  }

  function deposit(){
    view('存金',
      wins('存金')+
      '现在，决定你要交多少诚意。\n\n'+
      '小妲只说一次：\n<em>越多越好。</em>\n\n'+
      '存得少，她会看你一眼。\n存得多，她才会真正愿意多给你一点时间。\n\n'+
      '<strong>必须扫码完成才会入账。</strong>'
    );
    say('选吧。\n我看着你选多少。');
    keys([
      {l:'100（认真的）',main:1,gold:1,f:function(){openPay(100,afterPay);}},
      {l:'50',pink:1,f:function(){openPay(50,afterPay);}},
      {l:'10',f:function(){openPay(10,afterPay);}},
      {l:'返回主菜单',dim:1,full:1,f:menu}
    ]);
  }

  function afterPay(a){
    var t='', sayText='';
    if(a>=100){
      t='一百……\n\n小妲把脚尖点了点，像是有点满意。\n\n'+
        '「看来你还知道自己该怎么表现。」\n\n'+
        '获赠 <em>'+a+'</em> 积分。\n当前积分：'+points+'\n\n'+
        '这一次，她会多看你一会儿。';
      sayText='做得不错。\n可以去取精了。';
    }else if(a>=50){
      t='五十。\n\n「还算听话。」\n\n'+
        '获赠 <em>'+a+'</em> 积分。\n当前积分：'+points+'\n\n'+
        '够你换一次比较像样的服务了。\n但还远远不够让她真正高兴。';
      sayText='五十而已。\n继续努力。';
    }else{
      t='十块……\n\n小妲轻轻笑了一声。\n\n'+
        '「就这点？」\n\n'+
        '获赠 <em>'+a+'</em> 积分。\n当前积分：'+points+'\n\n'+
        '够你闻一口，不够你舔。\n更不够让她把你当回事。';
      sayText='十块也算存了。\n下次记得多一点。';
    }
    view('存金完成',wins('存金')+t);
    say(sayText);
    keys([
      {l:'去取精服务',pink:1,f:menuSvc},
      {l:'再存一笔',main:1,f:deposit},
      {l:'主菜单',dim:1,full:1,f:menu}
    ]);
  }

  function withdraw(){

      '现在只接受存金和取精。'

    keys([{l:'返回主菜单',main:1,f:menu}]);

  function menu(){
    view('主菜单',
      wins('')+
      '当前积分：<em>'+points+'</em>\n'+
      '累计存金：<em>'+paid+'</em>\n\n'+
      (playerName ? '贡奴「'+playerName+'」\n\n' : '')+
      '选择你要做的事。'
    );
    say(points>0 ? '积分还有。\n想换服务，或者再存一点，随你。' : '积分为零。\n想继续，就先存。');
    keys([
      {l:'存金',main:1,f:deposit},
      {l:'取金',f:withdraw},
      {l:'取精服务',pink:1,f:menuSvc},
      {l:'离开',dim:1,full:1,f:function(){
        view('离开','今晚到此结束。\n下次再来。');
        say('走吧。');
        keys([{l:'再来一次',main:1,f:function(){location.reload();}}]);
      }}
    ]);
  }

  function menuSvc(){
    view('取精服务',
      wins('取精')+
      '<div class="svc-list">'+
      '<div>· 闻脚 — <span class="cost">10积分</span> / 8秒</div>'+
      '<div>· 舔脚 — <span class="cost">30积分</span> / 12秒</div>'+
      '<div>· 足交 — <span class="cost">50积分</span> / 18秒</div>'+
      '<div>· 射精 — <span class="cost">100积分</span> / 10秒 ★终极</div>'+
      '</div>\n'+
      '当前积分：<em>'+points+'</em>\n\n'+
      '每一次服务时间到都会强制停止。\n想要更久、更多，就继续存。'
    );
    say('选一项。\n积分够就开，不够就先去存。');
    keys([
      {l:'闻脚 (10)',pink:1,f:function(){use('smell');}},
      {l:'舔脚 (30)',pink:1,f:function(){use('lick');}},
      {l:'足交 (50)',pink:1,f:function(){use('foot');}},
      {l:'射精 (100)',gold:1,f:function(){use('climax');}},
      {l:'返回主菜单',dim:1,full:1,f:menu}
    ]);
  }

  function use(k){
    var s=SVC[k];
    if(points<s.cost){
      view('积分不足',
        wins('取精')+
        '当前积分：'+points+'\n需要：'+s.cost+'\n\n'+
        '不够。\n\n'+
        '想要「'+s.name+'」，就先去存够。'
      );
      say('积分不够。\n先存。');
      keys([
        {l:'去存金',main:1,pink:1,f:deposit},
        {l:'返回服务列表',dim:1,full:1,f:menuSvc}
      ]);
      return;
    }
    points-=s.cost;bal();
    say('「'+s.name+'」开始。\n时间到必须停。');
    runTimer(s.name,s.sec,s.hint,s.gif,function(){
      var endText='';
      if(k==='climax'){
        endText='终极服务已经结束。\n\n'+
          '小妲把脚收回去，看着你：\n\n'+
          '「射完了？\n还想再来的话，就再存一笔。」';
      }else if(k==='foot'){
        endText='足交结束。\n\n'+
          '你还差一口气。\n时间却已经到了。\n\n'+
          '「想射的话，去换终极服务。\n或者……再存一点，我可以多给你几秒。」';
      }else if(k==='lick'){
        endText='舔脚结束。\n\n'+
          '味道还留在舌头上。\n可时间已经停了。\n\n'+
          '「还想继续？\n那就去存，或者换更进一步的。」';
      }else{
        endText='闻脚结束。\n\n'+
          '只是闻了一口，就被收回去了。\n\n'+
          '「想舔的话，积分够了再来。\n不够就先存。」';
      }
      view('服务结束',
        wins('取精')+
        '【'+s.name+'】已结束\n剩余积分：'+points+'\n\n'+endText
      );
      say(k==='climax'?'终极服务完成。还想再来就再存。':'时间到了。还想要就再换，或再存。');
      keys([
        {l:'再选服务',pink:1,f:menuSvc},
        {l:'存金',main:1,f:deposit},
        {l:'主菜单',dim:1,full:1,f:menu}
      ]);
    });
  }

})();
